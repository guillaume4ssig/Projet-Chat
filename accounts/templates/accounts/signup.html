{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h2>Créer un compte</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="font-size: 1em;">S'inscrire</button>
    </form>
    <hr>
    <p>Déjà un compte ? <a href="{% url 'login' %}">Se connecter</a></p>
</div>
</body>
</html>
