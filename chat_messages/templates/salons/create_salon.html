{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Création de salon</title>
    <link href="{% static 'style.css' %}" rel="stylesheet" />
</head>
<body>
<div class="container mt-5">
    <h2>Créer un salon</h2>
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Nom du salon" required class="form-input">
        <button type="submit" style="font-size: 1em;">Créer</button>
    </form>
</div>
</body>
</html>
