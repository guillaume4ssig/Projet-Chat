{% load static %}
<p>
    Connecté en tant que {{ request.user.username }}
    | <a href="{% url 'login' %}">Logout</a>
</p>

<hr>

{% for msg in msgs %}
    <p>
        <strong>{{ msg.sender.username }}</strong> :
        {{ msg.content }}
    </p>
{% endfor %}

<form method="post">
    {% csrf_token %}
    {{ form.media }}   
    {{ form.as_p }}
    <button type="submit">Envoyer</button>
</form>
