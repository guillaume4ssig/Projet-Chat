<p>
    Connecté en tant que {{ request.user.username }}
    | <a href="{% url 'logout' %}">Logout</a>
</p>

<hr>

{% for msg in msgs %}
    <p>
        <strong>{{ msg.sender.username }}</strong> :
        {{ msg.content }}
    </p>
{% endfor %}

<form method="post">
    {% csrf_token %}
    <input type="text" name="content" required>
    <button type="submit">Envoyer</button>
</form>
